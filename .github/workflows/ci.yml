name: CI & GitHub Pages Deployment Workflow

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rote CLI & Dependencies
        run: |
          curl -fsSL https://play.modiqo.ai/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          npm install

      - name: Run CI Build & Test
        run: |
          npm run build
          npm test

      # 🚨 Triggered ONLY on CI build/test failure -> Heals & auto-pushes fix to Git!
      - name: Autonomous Rote CI/CD Self-Healing Healer
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROTE_ACCESS_TOKEN: ${{ secrets.ROTE_ACCESS_TOKEN }}
        run: |
          mkdir -p ~/.rote/registry
          CLEAN_TOKEN=$(echo "$ROTE_ACCESS_TOKEN" | tr -d '\r\n')
          echo "{\"url\":\"https://roteprod.registry.modiqo.ai\",\"publishable_key\":\"sb_publishable_AXGLuahinAtyK0XL7_2RwA_9bageucy\",\"access_token\":\"$CLEAN_TOKEN\",\"refresh_token\":\"pyjmq6su6jup\"}" > ~/.rote/registry/config.json
          rote play run https://play.modiqo.ai/swapankumar/ci-self-healer@1.0.9 target_dir="$GITHUB_WORKSPACE" api_key="$GEMINI_API_KEY" model=gemini-3.5-flash auto_push=true --yes

      # 🚀 Triggered ONLY on CI build/test success -> Automatically publishes React App to GitHub Pages!
      - name: Deploy React App to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
