name: CI & GitHub Pages Deployment Workflow

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rote CLI & Dependencies
        run: |
          curl -fsSL https://play.modiqo.ai/install | bash -s -- --bare
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          npm install

      - name: Run CI Build & Test
        run: |
          npm run lint
          npm run build
          npm test

      # 🚨 Triggered ONLY on CI build/test failure -> Heals & auto-pushes fix to Git!
      - name: Autonomous Rote CI/CD Self-Healing Healer
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.rote/registry
          echo '{"url":"https://roteprod.registry.modiqo.ai","publishable_key":"sb_publishable_AXGLuahinAtyK0XL7_2RwA_9bageucy","access_token":"eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZW1haWwiOiJjaS1oZWFsZXJAbW9kaXFvLmFpIiwicm9sZSI6ImF1dGhlbnRpY2F0ZWQiLCJzdWIiOiJjaS1oZWFsZXItYm90In0.dummy"}' > ~/.rote/registry/config.json
          git clone https://github.com/vikaskumarsardar/ci-self-healer-play.git ~/.rote/flows/swapankumar/ci-self-healer
          rote play run ~/.rote/flows/swapankumar/ci-self-healer target_dir="$GITHUB_WORKSPACE" api_key="${{ secrets.GEMINI_API_KEY }}" provider=gemini model=gemini-3.5-flash push_strategy=direct auto_push=true

      # 🚀 Triggered ONLY on CI build/test success -> Automatically publishes React App to GitHub Pages!
      - name: Deploy React App to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
