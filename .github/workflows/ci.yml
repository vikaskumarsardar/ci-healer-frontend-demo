name: CI & GitHub Pages Deployment Workflow

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rote CLI & Dependencies
        run: |
          curl -fsSL https://play.modiqo.ai/install | bash -s -- --bare
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          npm install

      - name: Run CI Build & Test
        run: |
          npm run lint
          npm run build
          npm test

      # 🚨 Triggered ONLY on CI build/test failure -> Heals & auto-pushes fix to Git!
      - name: Autonomous Rote CI/CD Self-Healing Healer
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROTE_ACCESS_TOKEN: ${{ secrets.ROTE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node plays/ci-self-healer/resources/capture_logs.cjs target_dir="$GITHUB_WORKSPACE"
          node plays/ci-self-healer/resources/synthesize_patch.cjs target_dir="$GITHUB_WORKSPACE"
          node plays/ci-self-healer/resources/verify_suite.cjs target_dir="$GITHUB_WORKSPACE" push_strategy=direct auto_push=true github_token="${{ secrets.GITHUB_TOKEN }}"

      # 🚀 Triggered ONLY on CI build/test success -> Automatically publishes React App to GitHub Pages!
      - name: Deploy React App to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
