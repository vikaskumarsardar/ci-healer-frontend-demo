name: CI Workflow

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Rote CLI & Dependencies
        run: |
          npm install -g rote || true
          npm install

      - name: Run CI Build & Test
        run: |
          npm run build
          npm test

      # 🚨 Triggered ONLY on CI build/test failure
      - name: Autonomous Rote CI/CD Self-Healing Healer
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rote play run https://play.modiqo.ai/swapankumar/ci-test-healer@5.1.0 api_key=$GEMINI_API_KEY model=gemini-3.5-flash auto_push=true --yes
